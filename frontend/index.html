<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090D" />
    <title>Mi Garage</title>
    <style>
      html, body, #root { width: 100%; min-height: 100%; margin: 0; background: #08090d; }
      .boot-screen {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 15px; overflow: hidden;
        padding: 24px; padding-top: max(24px, env(safe-area-inset-top));
        padding-right: max(24px, env(safe-area-inset-right));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        padding-left: max(24px, env(safe-area-inset-left));
        background: radial-gradient(circle at 50% 45%, rgba(113, 76, 255, .16), transparent 34%), #08090d;
        color: #f5f7ff; font: 800 27px/1.2 system-ui, sans-serif;
      }
      .boot-brand { display: flex; align-items: center; gap: 12px; }
      .boot-mark {
        width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
        gap: 3px; border-radius: 13px; background: linear-gradient(135deg, #7b5cff, #4e31d8);
      }
      .boot-mark i { width: 4px; border-radius: 4px; background: white; }
      .boot-mark i:nth-child(1) { height: 10px; }
      .boot-mark i:nth-child(2) { height: 17px; }
      .boot-mark i:nth-child(3) { height: 13px; }
      .boot-message { margin: 0; color: #9296a7; font: 13px/1.5 system-ui, sans-serif; }
      .boot-progress { width: 42px; height: 2px; margin-top: 8px; border-radius: 2px; background: #282832; }
      .boot-progress::after {
        content: ""; display: block; width: 45%; height: 100%; border-radius: inherit;
        background: #8d76ff; animation: boot-progress 1.2s ease-in-out infinite;
      }
      @keyframes boot-progress { from { transform: translateX(-110%); } to { transform: translateX(220%); } }
      @media (prefers-reduced-motion: reduce) { .boot-progress::after { animation-duration: .01ms; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-live="polite">
        <div class="boot-brand"><span class="boot-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Mi Garage</span></div>
        <p class="boot-message">Cargando tus vehiculos...</p>
        <div class="boot-progress" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
